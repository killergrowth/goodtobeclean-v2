<!DOCTYPE html>
<html lang="en">
<head>
{{page_meta}}
{{base_head}}
</head>
<body id="top">
{{header}}

<!-- Page Hero with breadcrumbs inside -->
<section class="page-hero">
  <div class="container">
    <h1>{{page_title}}</h1>
    <p class="hero-subtitle">Expert tips, how-to guides, and industry insights from your Kansas restoration professionals.</p>
    <nav class="g2bc-breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="/">Home</a></li>
        <li><span class="current">Blog</span></li>
      </ol>
    </nav>
  </div>
</section>

<!-- Blog Grid -->
<!-- KG_GALLERY_CARDS -->
<section class="section-padded section-light">
  <div class="container">
    <div class="row">
      {{posts_html}}
    </div>
    {{pagination_html}}
  </div>
</section>

{{footer}}

<style>
.kg-blog-card-new {
  background: #fff;
  border: 1px solid #ebedf5;
  border-radius: 10px;
  overflow: hidden;
  height: 100%;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.2s, transform 0.2s;
}
.kg-blog-card-new:hover {
  box-shadow: 0 8px 32px rgba(0,14,57,0.12);
  transform: translateY(-3px);
}
.kg-card-thumb {
  display: block;
  overflow: hidden;
}
.kg-card-thumb img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
  transition: transform 0.3s;
}
.kg-blog-card-new:hover .kg-card-thumb img {
  transform: scale(1.04);
}
.kg-thumb-placeholder {
  width: 100%;
  height: 200px;
  background: #ebedf5;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #bbb;
  font-size: 2rem;
}
.kg-card-body-new {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.kg-card-date {
  font-size: 12px;
  color: #999;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.kg-card-title {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 10px;
}
.kg-card-title a {
  color: #000e39;
  text-decoration: none;
}
.kg-card-title a:hover {
  color: #d32f2f;
}
.kg-card-excerpt {
  font-size: 14px;
  color: #666;
  line-height: 1.6;
  flex: 1;
  margin-bottom: 16px;
}
.kg-card-readmore {
  font-size: 13px;
  font-weight: 700;
  color: #d32f2f;
  text-decoration: none;
}
.kg-card-readmore:hover {
  color: #000e39;
}
.mb-30 { margin-bottom: 30px; }
</style>

<a href="#top" class="scroll-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></a>
</body>
</html>
