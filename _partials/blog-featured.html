<div class="col-md-4">
  <div style="background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e2e6f0;height:100%;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,14,57,0.06);">
    <a href="{{url}}" tabindex="-1" aria-hidden="true">
      <img loading="lazy" src="{{image}}" alt="{{title}}" style="width:100%;height:220px;object-fit:cover;display:block;">
    </a>
    <div style="padding:24px 28px;flex:1;display:flex;flex-direction:column;">
      <div style="font-size:12px;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;">{{day}} {{month_year}}</div>
      <h3 style="font-size:17px;font-weight:700;margin:0 0 12px;line-height:1.4;"><a href="{{url}}" style="color:#000e39;text-decoration:none;">{{title}}</a></h3>
      <div style="font-size:14px;color:#555;line-height:1.7;flex:1;">{{excerpt_html}}</div>
      <div style="margin-top:18px;">
        <a href="{{url}}" aria-label="Read more about {{title}}" style="font-size:14px;font-weight:700;color:#d32f2f;text-decoration:none;">Read more <i class="fa-solid fa-arrow-right" style="font-size:11px;"></i></a>
      </div>
    </div>
  </div>
</div>
